<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>Pinhead map icon changelog</title>
    <style>
      body {
        font-family: ui-monospace, monospace;
        font-size: 13px;
      }
      a {
        color: inherit;
        text-decoration-thickness: 1px;
      }
      b {
        font-weight: bold;
      }
      h2 {
        position: sticky;
        top: 0;
        background: #fff;
        padding: 4px 0;
      }
      #header {
        max-width: 600px;
      }
    </style>
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-3MXM4VVNQP"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-3MXM4VVNQP");
    </script>
  </head>
  <body>
    <div id="content">
      <div id="header">
        <h1>Pinhead map icon changelog</h1>
        <p>
          This page lists icon changes made between major versions of
          <a href="/">Pinhead</a>. A machine-readable version of this data can
          be found <a href="/changelog.json">here</a>.
        </p>
      </div>
    </div>
    <script type="module">
      import { ChangelogDescriber } from "/src/ChangelogDescriber.js";

      const importSources = await fetch("/external_sources.json").then(
        (result) => result.json(),
      );

      const describer = new ChangelogDescriber(importSources);

      const changelogs = await fetch("/changelog.json").then((result) =>
        result.json(),
      );

      const currentVersion = changelogs[changelogs.length - 1].majorVersion;

      document.getElementById("content").insertAdjacentHTML(
        "beforeend",
        changelogs
          .toReversed()
          .map(
            (changelog) =>
              `<h2>Pinhead v${changelog.majorVersion} ${currentVersion === changelog.majorVersion ? "(latest)" : ""}— ${changelog.date}</h2>` +
              describer.getChangelogBodyHtml(changelog),
          )
          .join(""),
      );
    </script>
  </body>
</html>
